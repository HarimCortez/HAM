{% load web_extras %}<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  {% include "web/_head.html" %}
  <title>{% block title %}{{ church.short_name }} HAM{% endblock %}</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="public-shell">
    <header class="public-shell__bar">
      <img class="app-bar__logo" src="{{ church.logo_on_dark|brand_static }}"
           alt="{{ church.logo_alt }} — HAM" height="28">
    </header>
    <main id="main-content" class="public-shell__content" tabindex="-1">
      <div class="public-card">
        {% block public_content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
