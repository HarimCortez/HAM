[project]
name = "ham"
version = "0.1.0"
description = "HAM — Home Assistance Ministry web app"
requires-python = ">=3.11,<3.13"
dependencies = [
  "django>=5.2,<5.3",
  "psycopg[binary]>=3.2",
  "cryptography>=43.0",
  "pyotp>=2.9",
  "qrcode>=8.0",
  "procrastinate[django]>=2.15",
  "django-anymail>=12.0",
  "django-stubs-ext>=5.1",
  "whitenoise>=6.7",
  "gunicorn>=23.0",
  "django-environ>=0.11",
  "uuid6>=2024.7.10",
  # Duplicate matching phone keys (ham/requests/matching.py, Q-115). Pure library, no I/O.
  "phonenumbers>=8.13",
  # S2.4a object storage adapter: R2/S3-compatible presigned URLs (ham/integrations/storage).
  "boto3>=1.34",
  # S2.4b media processing job: re-encode + strip metadata (ham/media/processing.py, Q-120).
  "pillow>=11.0",
  "pillow-heif>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "factory-boy>=3.3",
  "time-machine>=2.16",
  # Test-only: builds a JPEG with real GPS/EXIF tags so tests/media/test_processing.py can
  # prove ham.media.processing actually strips them (Q-120), not just that it doesn't crash.
  "piexif>=1.1",
  "ruff>=0.7",
  "mypy>=1.13",
  "django-stubs[compatible-mypy]>=5.1",
  "pip-audit>=2.7",
  "import-linter>=2.1",
  # Visual QA / e2e screenshots (tests/e2e/, opt-in via HAM_SCREENSHOTS=1). Pinned to match
  # the Chromium build preinstalled at /opt/pw-browsers in the dev image — never run
  # `playwright install` (foundation.md §8 S5 build note).
  "playwright==1.56.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ham*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["design-system", "frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Expected-value tables in tests hold long plain-language strings the formatter cannot wrap.
"tests/**" = ["E501"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["frontend/", "design-system/", "migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "ham"]
addopts = "-ra"

[tool.importlinter]
root_package = "ham"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "web -> domain modules -> {authz, audit, outbox, rules, platform} (foundation.md §1, intake.md §2)"
type = "layers"
layers = [
  "ham.web",
  "ham.requester_portal",
  "ham.media",
  "ham.requests",
  "ham.notifications",
  "ham.identity",
  "ham.authz",
  "ham.audit",
  "ham.outbox",
  "ham.platform",
  "ham.rules",
]

[[tool.importlinter.contracts]]
name = "only ham.integrations imports anymail"
type = "forbidden"
source_modules = [
  "ham.web",
  "ham.outbox",
  "ham.platform",
]
forbidden_modules = [
  "anymail",
]

[[tool.importlinter.contracts]]
name = "domain modules never import ham.integrations directly"
# foundation.md §1: only ham.integrations talks to third parties, only as an outbox
# subscriber, with one documented exception — S3b's ham.identity calling
# ham.integrations.email.service.send_transactional_email for sign-in codes/links. intake.md
# §2 extends the same rule (and the same kind of documented exception) to the step-2 modules.
type = "forbidden"
source_modules = [
  "ham.web",
  "ham.outbox",
  "ham.platform",
  "ham.identity",
  "ham.requester_portal",
  "ham.media",
  "ham.requests",
  "ham.notifications",
]
forbidden_modules = [
  "ham.integrations",
]
ignore_imports = [
  "ham.identity.authn -> ham.integrations.email.service",
  "ham.identity.mfa -> ham.integrations.email.service",
  # ham.identity.notifications resolves its own outbox-triggered email content (invitation,
  # role-change, impersonation-ended notices, Q-055/Q-049/Q-084) the same way authn/mfa do for
  # sign-in codes; it is the one place identity registers builders with the email subscriber.
  "ham.identity.notifications -> ham.integrations.email.notifications",
  # S2.3: the requester-portal code/link email, same documented exception as
  # ham.identity.authn/mfa above (intake.md §2).
  "ham.requester_portal.verification -> ham.integrations.email.service",
  # FIX-F2/M7: `find_my_request`'s E4 "here's the link" email is sent immediately, same
  # documented exception/shape as ham.requester_portal.verification's code emails above (not
  # through the outbox -- there is no domain event worth one; it's purely a re-send of an
  # already-known fact).
  "ham.requester_portal.notifications -> ham.integrations.email.service",
  # S2.6 (intake.md §2, docs/ux/intake.md §7): requester and leadership email builders, same
  # documented exception as ham.identity.notifications above. ham.media.notifications does not
  # exist yet (no builder needed there this slice; L-E4 "new photos" in-app is a later gap) --
  # add that entry in the same commit that creates the file, per this list's own convention.
  "ham.requester_portal.notifications -> ham.integrations.email.notifications",
  "ham.requests.notifications -> ham.integrations.email.notifications",
]
